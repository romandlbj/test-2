server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: stocktake-backend
  datasource:
    # 本地 MYSQL84 连接：业务数据库 pfpdxt。
    name: MYSQL84
    url: jdbc:mysql://localhost:3306/pfpdxt?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: MYSQL84
      connection-timeout: 5000
      maximum-pool-size: 10
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: true

stocktake:
  auth:
    enabled: false
  page-size-default: 20
  page-size-max: 200
  export-max-rows: 50000
  month-base-days: 30

logging:
  level:
    com.yiling.stocktake: INFO
